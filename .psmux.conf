# vi:se ft=tmux:

# psmux (Windows) 用の設定。psmux は ~/.psmux.conf を ~/.tmux.conf より先に探し、
# 最初に見つかった 1 本しか読まないため、.tmux.conf の内容をここへ移植してある。
# .tmux.conf を変えたらこちらも追従させること。
#
# 以下は psmux では意味を持たないので移植していない:
#   default-shell /usr/bin/bash  既定の pwsh を使う。
#   terminal-overrides           psmux では明示的な no-op (ConPTY 相手なので terminfo が無い)。
#   terminal-features            未知のオプションとして ~/.psmux/config-warnings.log に
#                                警告が残るだけ。psmux の OSC 52 送信は terminfo の Ms を
#                                見ないので、そもそも不要。
#   bind -n WheelUpPane ...      マウスキー名は config を読めるように受理されるだけで
#                                動作しない。プロンプト上のホイールで copy-mode に入る
#                                挙動は scroll-enter-copy-mode (既定 on) が担う。

# tmux-256color の terminfo は Windows 側に無いので、pane の TERM は xterm-256color にする。
set-option -g default-terminal "xterm-256color"

# yank した内容を Windows クリップボードに書くのに加え、OSC 52 で外側の端末へも送る
# (ssh 越しに psmux を使ったときも接続元へ届く)。psmux は on と external を区別せず、
# off 以外なら両方送る。
set-option -s set-clipboard on

# reduce Esc key delay (psmux の既定は 500ms)。値は .tmux.conf に揃える。
set -sg escape-time 100
# enlarge scrollback for long outputs
set-option -g history-limit 50000
# enable focus events for editor integrations
set-option -g focus-events on
# keep VS Code's `code` CLI socket fresh on (re)attach (理由は .tmux.conf を参照)。
set-option -ga update-environment " VSCODE_IPC_HOOK_CLI"

set -g prefix C-q
unbind C-b

set-option -g status-interval 1

set-option -g status-position top
set-option -g status-style "bg=black,fg=white"

set-option -g status-justify "centre"

# 既定値は left 10 / right 40 で、"Session: #S " はセッション名 1 文字でも切れる。
set-option -g status-left-length 90
set-option -g status-right-length 90

# Note: status-left | window-status-format | status-right
# psmux の既定 status-right は pane title を含むので、ここで必ず上書きする。
set-option -g status-left "#[fg=white,bg=brightblack]Session: #S #[default]"
set-option -g status-right "#[fg=white,bg=brightblack] #h | %m/%d %H:%M:%S#[default]"

set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format "#[fg=colour255,bg=colour27,bold] #I: #W #[default]"

# use vim key bind to move around between panes
bind-key    -T prefix h select-pane -L
bind-key    -T prefix j select-pane -D
bind-key    -T prefix k select-pane -U
bind-key    -T prefix l select-pane -R

# use vim key bind to resize a pane
bind-key -r -T prefix H resize-pane -L 5
bind-key -r -T prefix J resize-pane -D 5
bind-key -r -T prefix K resize-pane -U 5
bind-key -r -T prefix L resize-pane -R 5

# | to split pane vertically
bind-key    -T prefix | split-window -h
unbind %
# - to split pane horizontally
bind-key    -T prefix - split-window -v
unbind '"'

set-option -g base-index 1

# enable mouse manipulation
set-option -g mouse on

# set up copy mode
# use vim keybind in copy mode
setw -g mode-keys vi

bind-key    -T prefix       v   copy-mode
bind-key    -T copy-mode-vi v   send -X begin-selection
bind-key    -T copy-mode-vi V   send -X select-line
bind-key    -T copy-mode-vi C-v send -X rectangle-toggle
bind-key    -T copy-mode-vi y   send -X copy-selection
bind-key    -T copy-mode-vi Y   send -X copy-line

bind-key                    C-p paste-buffer
